[package]
name = "kernel"
version.workspace = true
edition.workspace = true
description = "blmoadll kernel: plugin processes, capability routing, events, hot reload"

[dependencies]
serde_json.workspace = true
tokio.workspace = true
protocol = { path = "../protocol" }
loader = { path = "../loader" }
logger = { path = "../logger" }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[features]
fixture = []
host = []

[[bin]]
name = "blmoadll-fixture"
path = "src/bin/blmoadll-fixture.rs"
required-features = ["fixture"]

[[test]]
name = "host"
path = "tests/host.rs"
required-features = ["fixture"]

[[bin]]
name = "blmoadll"
path = "src/bin/blmoadll.rs"
required-features = ["host"]

[[test]]
name = "host_process"
path = "tests/host_process.rs"
required-features = ["fixture", "host"]