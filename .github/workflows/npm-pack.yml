name: npm pack

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  pack:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: cargo test --workspace --all-features
      - run: npm run test:pack
      - run: New-Item -ItemType Directory -Force artifacts | Out-Null
      - run: npm pack --pack-destination artifacts
      - run: npm pack ./platforms/win32-x64 --pack-destination artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: blmoadll-win32-x64
          path: artifacts/*.tgz