name: build-kernel

# 触发：① 网页手动 Run workflow  ② 推一个 v 开头的 tag（tag 触发会把产物挂到 Release，手机免登录下载）
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  # install.js 的 BINS 要求两个都在，且特性必须是 fixture,host
  BINS: "blmoadll blmoadll-fixture"
  PACKAGE: "kernel"
  FEATURES: "fixture,host"

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: .exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""

    steps:
      - uses: actions/checkout@v4

      - name: Verify the bin sources are tracked
        shell: bash
        run: |
          set -euo pipefail
          # 按 Cargo.toml 里 [[bin]] 的 path 逐个查，不关心入口放在哪个目录
          missing=0
          while IFS= read -r rel; do
            f="crates/kernel/${rel}"
            if [ ! -f "$f" ]; then
              echo "::error title=缺少 ${f}::${f} 不在仓库里。若入口放在 src/bin/ 下，.gitignore 的 'bin/' 会吞掉它，改成 '/bin/' 或把入口移到 src/ 下"
              missing=1
            fi
          done < <(grep -oE '^path[[:space:]]*=[[:space:]]*"[^"]+"' crates/kernel/Cargo.toml | grep -oE '"[^"]+"' | tr -d '"')
          [ "$missing" -eq 0 ] || exit 1

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked \
            --package "${PACKAGE}" \
            --bins \
            --features "${FEATURES}" \
            --target "${{ matrix.target }}"

      - name: Stage artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          rel="target/${{ matrix.target }}/release"
          n=0
          for name in ${BINS}; do
            src="${rel}/${name}${{ matrix.ext }}"
            if [ -f "${src}" ]; then
              dst="out/${name}-${{ matrix.target }}${{ matrix.ext }}"
              cp "${src}" "${dst}"
              chmod +x "${dst}" || true
              n=$((n + 1))
            else
              echo "::error::缺少 ${src}"
              ls -la "${rel}" || true
              exit 1
            fi
          done
          echo "staged ${n} binaries"
          ls -lh out/

      - uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ matrix.target }}
          path: out/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: attach to release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - run: ls -lh artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
