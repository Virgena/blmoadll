name: build-kernel

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: "Tag to attach the artifacts to; it must equal the version in Cargo.toml with a v prefix. Empty means build without creating a release."
        type: string
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  BINS: "blmoadll blmoadll-fixture"
  PACKAGE: "kernel"
  FEATURES: "fixture,host"

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: .exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Verify the version matches the tag
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "${TAG}" ]; then
            node scripts/version.mjs check --tag "${TAG}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            node scripts/version.mjs check --tag "${GITHUB_REF_NAME}"
          else
            node scripts/version.mjs check
          fi

      - name: Verify the bin sources are tracked
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          while IFS= read -r rel; do
            f="crates/kernel/${rel}"
            if [ ! -f "$f" ]; then
              echo "::error title=缺少 ${f}::${f} 不在仓库里。若入口放在 src/bin/ 下，.gitignore 的 'bin/' 会吞掉它，改成 '/bin/' 或把入口移到 src/ 下"
              missing=1
            fi
          done < <(grep -oE '^path[[:space:]]*=[[:space:]]*"[^"]+"' crates/kernel/Cargo.toml | grep -oE '"[^"]+"' | tr -d '"')
          [ "$missing" -eq 0 ] || exit 1

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked \
            --package "${PACKAGE}" \
            --bins \
            --features "${FEATURES}" \
            --target "${{ matrix.target }}"

      - name: Stage artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          rel="target/${{ matrix.target }}/release"
          n=0
          for name in ${BINS}; do
            src="${rel}/${name}${{ matrix.ext }}"
            if [ -f "${src}" ]; then
              dst="out/${name}-${{ matrix.target }}${{ matrix.ext }}"
              cp "${src}" "${dst}"
              chmod +x "${dst}" || true
              n=$((n + 1))
            else
              echo "::error::缺少 ${src}"
              ls -la "${rel}" || true
              exit 1
            fi
          done
          echo "staged ${n} binaries"
          ls -lh out/

      - uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ matrix.target }}
          path: out/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: attach to release
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - run: ls -lh artifacts
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: artifacts/*
          generate_release_notes: true
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}
          fail_on_unmatched_files: true
